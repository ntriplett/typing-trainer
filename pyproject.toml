[project]
name = "typing-trainer"
version = "0.2.0"
description = "Local browser-based touch-typing tutor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "playwright>=1.47",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
markers = [
    "no_player: e2e test starts with no player picked (welcome screen)",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["app", "app.activities", "launcher"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
