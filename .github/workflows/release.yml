name: release

# Tag a version to ship it to Windows installs:
#   (bump version in pyproject.toml, run uv lock, commit)  git tag -a v1.1.0 -m v1.1.0 && git push origin v1.1.0
# Runs the tests, then publishes a GitHub release with the app zip and the
# installer. Installed copies offer the update on the For grown-ups page.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match pyproject version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "pyproject.toml says $v but the tag is $GITHUB_REF_NAME"; exit 1
          fi
      - name: Build the zip
        run: |
          mkdir dist
          git archive --format=zip --prefix=typing-trainer/ -o "dist/typing-trainer-$GITHUB_REF_NAME.zip" HEAD
          cp windows/install.ps1 windows/Install-TypingTrainer.cmd dist/
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
