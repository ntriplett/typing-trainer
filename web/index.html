<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typing Trainer</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/static/css/home.css" />
</head>
<body data-particles>
  <main class="home">
    <section class="panel home-hero">
      <canvas id="home-avatar" class="avatar-canvas" width="192" height="192"></canvas>
      <div class="home-hero-text">
        <h1 id="home-greeting">Welcome back!</h1>
        <p id="home-sub" class="home-sub"></p>
        <div id="home-day"></div>
      </div>
    </section>

    <nav class="home-grid" aria-label="Where to?">
      <a class="home-tile tile-practice" href="/session" id="tile-practice">
        <canvas class="tile-art" data-icon="practice" width="360" height="200"></canvas>
        <span class="tile-name">Practice</span>
        <span class="tile-sub" id="practice-sub">Your next lesson is ready!</span>
      </a>
      <a class="home-tile tile-arcade" href="/arcade">
        <canvas class="tile-art" data-icon="arcade" width="400" height="120"></canvas>
        <span class="tile-name">Arcade</span>
        <span class="tile-sub"><span class="token-icon"></span> <span id="arcade-tokens">0 tokens</span></span>
      </a>
      <a class="home-tile tile-progress" href="/analysis">
        <canvas class="tile-art" data-icon="progress" width="160" height="120"></canvas>
        <span class="tile-name">Progress</span>
        <span class="tile-sub">See how you're growing</span>
      </a>
      <a class="home-tile tile-garden" href="/garden">
        <canvas class="tile-art" data-icon="garden" width="160" height="120"></canvas>
        <span class="tile-name">Garden</span>
        <span class="tile-sub" id="garden-sub">Grow veggies</span>
      </a>
      <a class="home-tile tile-store" href="/store">
        <canvas class="tile-art" data-icon="store" width="160" height="120"></canvas>
        <span class="tile-name">Store</span>
        <span class="tile-sub">Hats, pets, places</span>
      </a>
      <a class="home-tile tile-pets" href="/pets">
        <canvas class="tile-art" data-icon="pets" width="160" height="120"></canvas>
        <span class="tile-name" id="pets-name">Pets</span>
        <span class="tile-sub" id="pets-sub">Shop, care, and play</span>
      </a>
      <a class="home-tile tile-bedroom" href="/bedroom">
        <canvas class="tile-art" data-icon="bedroom" width="160" height="120"></canvas>
        <span class="tile-name" id="bedroom-name">Bedroom</span>
        <span class="tile-sub" id="bedroom-sub">Decorate it</span>
      </a>
      <a class="home-tile tile-wardrobe" href="/wardrobe">
        <canvas class="tile-art" data-icon="wardrobe" width="160" height="120"></canvas>
        <span class="tile-name">Wardrobe</span>
        <span class="tile-sub">Get dressed</span>
      </a>
    </nav>
    <p class="home-footnote"><a href="/parent">Grown-ups</a></p>
  </main>
  <script src="/static/js/sprites.js"></script>
  <script src="/static/js/backgrounds.js"></script>
  <script src="/static/js/wardrobe.js"></script>
  <script src="/static/js/pets.js"></script>
  <script src="/static/js/avatar.js"></script>
  <script src="/static/js/themes.js"></script>
  <script src="/static/js/veggies.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/home_icons.js"></script>
  <script src="/static/js/home.js"></script>
</body>
</html>
