<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typing Trainer — Pet Shop</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/static/css/pet_shop.css" />
</head>
<body data-particles>
  <main class="pet-shop">
    <header class="page-head">
      <h1>The Pet Shop</h1>
      <nav class="signposts" aria-label="Go back"><a class="signpost" href="/pets">🐾 Pets</a><a class="signpost" href="/">🏠 Home</a></nav>
    </header>
    <div id="shop-coupon" class="panel shop-banner coupon-banner" hidden></div>
    <div id="shop-saved" class="panel shop-banner saved-banner" hidden></div>
    <p id="shop-message" class="error-text" role="status"></p>
    <section class="panel shop-floor">
      <h2 id="dept-title" class="panel-title"></h2>
      <div id="shop-scene" class="shop-scene">
        <canvas id="shop-canvas" width="960" height="540" aria-hidden="true"></canvas>
        <div id="shop-spots"></div>
      </div>
      <p id="dept-hint" class="hint"></p>
      <div id="shop-grid" class="shop-grid"></div>
    </section>
  </main>

  <dialog id="pet-detail" class="pet-detail panel">
    <button class="detail-close link-button" aria-label="Close">✕</button>
    <div id="detail-body"></div>
  </dialog>

  <script src="/static/js/sprites.js"></script>
  <script src="/static/js/backgrounds.js"></script>
  <script src="/static/js/wardrobe.js"></script>
  <script src="/static/js/pet_render.js"></script>
  <script src="/static/js/avatar.js"></script>
  <script src="/static/js/themes.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/habitats.js"></script>
  <script src="/static/js/habitats_outdoors.js"></script>
  <script src="/static/js/habitats_cozy.js"></script>
  <script src="/static/js/habitats_magic.js"></script>
  <script src="/static/js/aquarium_items.js"></script>
  <script src="/static/js/pet_motion.js"></script>
  <script src="/static/js/shop_scenes.js"></script>
  <script src="/static/js/pet_shop.js"></script>
</body>
</html>
