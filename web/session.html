<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Typing Trainer — Practice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/static/css/teach.css" />
  <link rel="stylesheet" href="/static/css/stage.css" />
  <link rel="stylesheet" href="/static/css/session.css" />
</head>
<body>
  <main class="teach-main">
    <p id="loading" class="panel">Picking your next lesson…</p>

    <div id="lesson-screen" hidden>
      <div class="panel typing-panel">
        <div id="stage"></div>
        <div id="lesson-result" hidden>
          <h2 id="result-headline"></h2>
          <p id="result-summary"></p>
          <p id="result-rewards" class="result-rewards"></p>
          <nav class="result-nav">
            <button id="next-button" class="button-go big-button">Next lesson →</button>
            <a id="arcade-button" class="button button-gold big-button" href="/arcade" hidden>Go to the arcade</a>
            <a class="button big-button" href="/">Home</a>
          </nav>
          <p class="result-keys" id="result-keys">Press <kbd class="keycap">Enter</kbd> for the next lesson, or <kbd class="keycap">Esc</kbd> to go home.</p>
        </div>
      </div>
      <nav id="lesson-nav">
        <button id="end-now-button">End this lesson</button>
        <a class="button" href="/">Home</a>
      </nav>
    </div>

    <section id="rest-screen" class="panel rest-screen" hidden>
      <h1>All done for today!</h1>
      <p class="rest-text">You earned every token. Practice opens again <span id="rest-until"></span>.</p>
      <div id="rest-day"></div>
      <nav class="result-nav">
        <a class="button button-gold big-button" href="/arcade">Go to the arcade</a>
        <a class="button big-button" href="/">Home</a>
      </nav>
    </section>
  </main>
  <script src="/static/js/sprites.js"></script>
  <script src="/static/js/backgrounds.js"></script>
  <script src="/static/js/wardrobe.js"></script>
  <script src="/static/js/pets.js"></script>
  <script src="/static/js/avatar.js"></script>
  <script src="/static/js/themes.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/keyboard_data.js"></script>
  <script src="/static/js/teach_keyboard.js"></script>
  <script src="/static/js/prompt_view.js"></script>
  <script src="/static/js/rich_text.js"></script>
  <script src="/static/js/practice_scenes.js"></script>
  <script src="/static/js/practice_stage.js"></script>
  <script src="/static/js/session.js"></script>
</body>
</html>
