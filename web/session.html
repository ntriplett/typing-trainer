<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Typing Trainer — Session</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/session.css" />
</head>
<body>
  <main>
    <h1>Typing Trainer</h1>

    <div id="start-screen">
      <p>Ready for a short practice session?</p>
      <label><input type="checkbox" id="quick-test-checkbox" /> Quick test (short lessons, for trying things out)</label>
      <p><button id="start-button">Start session</button></p>
    </div>

    <div id="session-screen" hidden>
      <p id="phase-label"></p>
      <p id="instructions"></p>
      <p id="progress"></p>
      <div id="prompt-viewport">
        <div id="prompt"></div>
      </div>
      <div id="step-result" hidden>
        <h2 id="result-headline"></h2>
        <p id="result-summary"></p>
        <button id="next-button">Next lesson →</button>
      </div>

      <nav id="session-nav">
        <button id="end-now-button">End this step now</button>
        <button id="home-button">Home</button>
        <!-- more nav controls (pause, settings, etc.) land here later -->
      </nav>
    </div>

    <div id="complete-screen" hidden>
      <h2>🎉 Session complete!</h2>
      <ul id="summary-list"></ul>
      <nav>
        <button id="complete-home-button">Home</button>
        <button id="complete-new-session-button">Start another session</button>
      </nav>
    </div>
  </main>
  <script src="/static/js/session.js"></script>
</body>
</html>
