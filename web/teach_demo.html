<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Typing Trainer — Teach Demo</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/teach_demo.css" />
</head>
<body>
  <main>
    <h1>Teach Module Demo</h1>
    <p><a href="/">← Home</a></p>
    <p class="hint">
      Pick a module and a key to teach. These 3 are experimental variants for comparison --
      nothing here touches real progress data.
    </p>

    <div id="setup-screen">
      <div class="config-row">
        <label for="module-select">Teaching style</label>
        <select id="module-select"></select>
        <p id="module-description" class="hint"></p>
      </div>

      <div class="config-row">
        <label for="key-select">Key to teach</label>
        <select id="key-select">
          <option value="r">R (left index reach, up)</option>
          <option value="e">E (left middle reach, up)</option>
          <option value="u">U (right index reach, up)</option>
          <option value="i">I (right middle reach, up)</option>
          <option value="g">G (left index reach, right)</option>
          <option value="h">H (right index reach, left)</option>
        </select>
      </div>

      <p><button id="start-button" class="big-button">Start lesson</button></p>
    </div>

    <div id="lesson-screen" hidden>
      <p id="micro-step-progress" class="hint"></p>

      <div id="diagram-area">
        <svg id="hand-diagram" viewBox="0 0 640 220" role="img" aria-label="Keyboard and hand diagram"></svg>
      </div>

      <p id="step-instructions"></p>
      <p id="lesson-progress"></p>
      <div id="lesson-prompt-viewport">
        <div id="lesson-prompt"></div>
      </div>

      <div id="micro-step-result" hidden>
        <button id="continue-button">Continue →</button>
      </div>

      <nav>
        <button id="restart-button">Choose another</button>
      </nav>
    </div>

    <div id="lesson-complete-screen" hidden>
      <h2>Lesson complete</h2>
      <p id="final-result"></p>
      <button id="try-another-button">Try another</button>
    </div>
  </main>
  <script src="/static/js/keyboard_data.js"></script>
  <script src="/static/js/teach_demo.js"></script>
</body>
</html>
