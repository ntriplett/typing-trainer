<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Typing Trainer — Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/static/css/teach.css" />
  <link rel="stylesheet" href="/static/css/stage.css" />
  <link rel="stylesheet" href="/static/css/game.css" />
</head>
<body>
  <main class="teach-main">
    <section class="panel">
      <div id="game" class="stage"></div>
    </section>
  </main>
  <script src="/static/js/sprites.js"></script>
  <script src="/static/js/backgrounds.js"></script>
  <script src="/static/js/wardrobe.js"></script>
  <script src="/static/js/pet_render.js"></script>
  <script src="/static/js/avatar.js"></script>
  <script src="/static/js/themes.js"></script>
  <script src="/static/js/scenery.js"></script>
  <script src="/static/js/alive.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/rich_text.js"></script>
  <script src="/static/js/practice_scenes.js"></script>
  <script src="/static/js/game_kit.js"></script>
  <script src="/static/js/crow_patrol.js"></script>
  <script src="/static/js/pet_battle.js"></script>
  <script src="/static/js/veggies.js"></script>
  <script src="/static/js/farm_stand.js"></script>
  <script>
    // One game: from the lab (/game/<id>?keys=&focus=&difficulty=), or a
    // paid play from the arcade (?arcade=1: no free replays, back to the arcade).
    const moduleId = decodeURIComponent(location.pathname.split("/").pop());
    const fromArcade = new URLSearchParams(location.search).has("arcade");
    const root = document.getElementById("game");

    Promise.all([
      fetch(`/api/game/${moduleId}/content${location.search}`).then(async (r) => ({ ok: r.ok, body: await r.json() })),
      window.Header ? Header.ready : Promise.resolve(null),
    ]).then(([res, me]) => {
      if (!res.ok) {
        root.innerHTML = `<h1 class="stage-title">Not yet!</h1><p class="stage-text">${escapeHtml(res.body.detail || "This game couldn't load.")}</p>`;
        return;
      }
      const shell = new GameShell(root, res.body, {
        moduleId,
        replay: !fromArcade,
        onDone: () => (location.href = fromArcade ? "/arcade" : "/game-lab"),
      });
      window.game = GAMES[res.body.game.game](shell, res.body, me); // tests drive it through window.game
    });
  </script>
</body>
</html>
