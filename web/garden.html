<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typing Trainer — Garden</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/static/css/garden.css" />
</head>
<body data-particles>
  <main class="garden">
    <section class="panel garden-hero">
      <div class="garden-wallet">
        <span class="seed-icon big"></span>
        <span id="garden-seeds">0</span>
      </div>
      <div>
        <h1>Your Garden</h1>
        <p id="garden-hint" class="garden-hint"></p>
      </div>
    </section>
    <p id="garden-message" class="garden-message" role="status"></p>
    <section class="garden-bed" id="garden-bed" aria-label="Garden spots"></section>
    <p class="garden-keys">Arrow keys to move, <kbd class="keycap">Enter</kbd> to plant or pick, <kbd class="keycap">B</kbd> for the basket, <kbd class="keycap">Esc</kbd> to go home.</p>
    <section class="garden-shelf">
      <div class="panel garden-basket" id="garden-basket">
        <h2>Basket</h2>
        <div class="veggie-list" id="basket-list"></div>
        <button id="basket-button" class="button-go">Collect</button>
      </div>
      <div class="panel garden-pantry">
        <h2>Your veggies</h2>
        <div class="veggie-list" id="pantry-list"></div>
      </div>
    </section>
  </main>
  <script src="/static/js/sprites.js"></script>
  <script src="/static/js/backgrounds.js"></script>
  <script src="/static/js/wardrobe.js"></script>
  <script src="/static/js/pet_render.js"></script>
  <script src="/static/js/avatar.js"></script>
  <script src="/static/js/themes.js"></script>
  <script src="/static/js/scenery.js"></script>
  <script src="/static/js/veggies.js"></script>
  <script src="/static/js/alive.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/garden.js"></script>
</body>
</html>
