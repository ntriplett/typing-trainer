<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typing Trainer — Arcade</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script src="/static/js/ui_scale.js"></script>
  <link rel="stylesheet" href="/static/css/arcade.css" />

<body data-particles>
  <main class="arcade">
    <section class="panel arcade-hero">
      <div class="arcade-wallet">
        <span class="token-icon big"></span>
        <span id="arcade-balance">0</span>
      </div>
      <div>
        <h1>The Arcade</h1>
        <p id="arcade-hint" class="arcade-hint"></p>
        <div id="arcade-day"></div>
      </div>
    </section>
    <p id="arcade-message" class="arcade-message" role="status"></p>
    <div id="arcade-games" class="arcade-games"></div>
  </main>
  <script src="/static/js/sprites.js"></script>
  <script src="/static/js/backgrounds.js"></script>
  <script src="/static/js/wardrobe.js"></script>
  <script src="/static/js/pet_render.js"></script>
  <script src="/static/js/avatar.js"></script>
  <script src="/static/js/themes.js"></script>
  <script src="/static/js/scenery.js"></script>
  <script src="/static/js/alive.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/rich_text.js"></script>
  <script src="/static/js/home_icons.js"></script>
  <script src="/static/js/arcade.js"></script>
</body>
</html>
