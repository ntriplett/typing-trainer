<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typing Trainer — Pet Room</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/static/css/teach.css" />
  <link rel="stylesheet" href="/static/css/pets.css" />

<body data-particles data-unlock="pets">
  <main>
    <h1>Pet Room</h1>
    <section class="panel yard-panel">
      <canvas id="pet-yard" class="avatar-canvas" width="576" height="288"></canvas>
    </section>

    <section class="panel">
      <h2 class="panel-title">Your pets</h2>
      <p class="hint" id="pets-hint"></p>
      <div id="pet-cards" class="pet-grid"></div>
    </section>
  </main>
  <script src="/static/js/sprites.js"></script>
  <script src="/static/js/backgrounds.js"></script>
  <script src="/static/js/wardrobe.js"></script>
  <script src="/static/js/pets.js"></script>
  <script src="/static/js/avatar.js"></script>
  <script src="/static/js/themes.js"></script>
  <script src="/static/js/rich_text.js"></script>
  <script src="/static/js/home_icons.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/petroom.js"></script>
</body>
</html>
