<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Typing Trainer — Pet Lab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script src="/static/js/ui_scale.js"></script>
  <link rel="stylesheet" href="/static/css/teach.css" />
  <link rel="stylesheet" href="/static/css/pet_lab.css" />
</head>
<body>
  <main class="lab-main">
    <section class="panel">
      <h1>Pet lab</h1>
      <p class="hint">Roll and grow pets for free. Nothing here is saved. Click a pet in the litter to see it in every design, at every stage.</p>
      <div class="lab-options">
        <label>Species <select id="opt-species"></select></label>
        <label>Primary <select id="opt-primary"></select></label>
        <label>Secondary <select id="opt-secondary"></select></label>
        <label>Design <select id="opt-variant"></select></label>
        <label><input id="opt-plain" type="checkbox" /> Plain test color <input id="opt-plain-color" type="color" value="#a88a6a" /></label>
        <label>Growth <input id="opt-growth" type="range" min="0" max="10" value="10" /> <span id="growth-value">10</span></label>
        <button id="roll-button" class="button-go">Roll a litter</button>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel-title">Litter</h2>
      <div id="litter" class="litter"></div>
    </section>

    <section class="panel" id="closeup" hidden>
      <h2 class="panel-title">Close-up: seed <span id="close-seed"></span></h2>
      <p>
        <button id="adopt-button" class="button-go">Adopt at growth <span id="adopt-growth">10</span></button>
        <span id="adopt-message" role="status"></span>
      </p>
      <div id="variant-rows" class="variant-rows"></div>
      <h3>Design it yourself</h3>
      <div class="lab-options designer">
        <label>Name <input id="opt-name" maxlength="16" placeholder="(its kind)" /></label>
        <label id="breed-knob">Breed <select id="opt-breed"></select></label>
        <label id="mix-knob">Mixed: <select id="opt-mixpart"></select> from <select id="opt-mixdonor"></select></label>
        <label>Coat style <select id="opt-style"></select></label>
        <label>Main color <select id="opt-c0"></select></label>
        <label>Second color <select id="opt-c1"></select></label>
        <label>Third color <select id="opt-c2"></select></label>
        <label>Second color's share <input id="opt-s1" type="range" min="0" max="0.7" step="0.01" /> <span id="s1-value"></span></label>
        <label>Third color's share <input id="opt-s2" type="range" min="0" max="0.5" step="0.01" /> <span id="s2-value"></span></label>
        <label>Eyes <input id="opt-eyes" type="color" /> <select id="opt-eyes-pick"></select></label>
        <label><input id="opt-odd" type="checkbox" /> Odd eye <input id="opt-oddeye" type="color" /></label>
        <label>Loves <select id="opt-favorite"></select></label>
      </div>
      <div class="design-json">
        <label for="design-json">Design (JSON): copy it out, or paste one in and Load</label>
        <textarea id="design-json" rows="5" spellcheck="false"></textarea>
        <p><button id="json-copy">Copy</button> <button id="json-load">Load</button> <span id="json-message" role="status"></span></p>
      </div>
      <div class="lab-options">
        <label>Pattern
          <select id="opt-pattern"></select>
        </label>
        <label id="finpat-knob">Fin pattern
          <select id="opt-finpat">
            <option>clear</option><option>solid</option><option>edged</option><option>tipped</option><option>gradient</option><option>striped</option><option>spotted</option><option>rayed</option>
          </select>
        </label>
        <label>Splotch <input id="opt-splotch" type="range" min="0" max="1" step="0.05" /> <span id="splotch-value"></span></label>
        <label>Length <input id="opt-length" type="range" min="-3" max="3" step="1" /></label>
        <label>Height <input id="opt-height" type="range" min="-3" max="3" step="1" /></label>
        <label>Ears <input id="opt-ears" type="range" min="0" max="2" step="0.1" /> <span id="ears-value"></span></label>
        <label>Tail <input id="opt-tail" type="range" min="-1" max="1" step="0.1" /></label>
        <label id="weight-knob">Weight <input id="opt-weight" type="range" min="-1" max="1" step="0.1" /></label>
        <label id="snout-knob">Snout <input id="opt-snout" type="range" min="-1" max="1" step="0.1" /></label>
        <label id="legs-knob">Legs <input id="opt-legs" type="range" min="-1" max="1" step="0.1" /></label>
        <label id="wool-knob">Wool <input id="opt-wool" type="range" min="-1" max="1" step="0.1" /></label>
        <label id="horns-knob">Horns <input id="opt-horns" type="range" min="-1" max="1" step="0.1" /></label>
        <label id="neck-knob">Neck <input id="opt-neck" type="range" min="-1" max="1" step="0.1" /></label>
        <label id="dome-knob">Dome <input id="opt-dome" type="range" min="-1" max="1" step="0.1" /></label>
        <label id="crest-knob">Crest <input id="opt-crest" type="range" min="-1" max="1" step="0.1" /></label>
        <label id="thick-knob">Thickness <input id="opt-thick" type="range" min="-1" max="1" step="0.1" /></label>
        <label id="wings-knob">Wings <input id="opt-wings" type="range" min="-1" max="1" step="0.1" /></label>
        <label id="fins-knob">Fins <input id="opt-fins" type="range" min="-1" max="1" step="0.1" /></label>
        <label id="tailh-knob">Tail height <input id="opt-tailh" type="range" min="-1" max="1" step="0.1" /></label>
        <label id="size-knob">Size <input id="opt-size" type="range" min="-1" max="1" step="0.1" /></label>
        <label>Shiny <select id="opt-shine"><option value="">none</option><option value="sparkle">Sparkly</option><option value="holo">Holo</option><option value="glow">Glowing</option><option value="starry">Starry</option></select></label>
      </div>
      <canvas id="solo" class="stages-art" width="960" height="320"></canvas>
      <pre id="close-stats" class="lab-stats"></pre>
    </section>
  </main>
  <script src="/static/js/sprites.js"></script>
  <script src="/static/js/pet_render.js"></script>
  <script src="/static/js/pet_lab.js"></script>
</body>
</html>
