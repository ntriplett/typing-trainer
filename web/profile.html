<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typing Trainer — Profile</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script src="/static/js/ui_scale.js"></script>
  <link rel="stylesheet" href="/static/css/profile.css" />
</head>
<body data-particles>
  <main>
    <section class="panel profile-hero">
      <canvas id="profile-avatar" class="avatar-canvas" width="240" height="240"></canvas>
      <div>
        <h1 id="profile-name">…</h1>
        <p class="choice-row">
          <a class="button" href="/bedroom?room=mirror">Change my look</a>
          <button id="switch-player" class="button-gold">Switch player</button>
        </p>
        <div class="stat-grid" id="stats"></div>
      </div>
    </section>

  </main>
  <script src="/static/js/sprites.js"></script>
  <script src="/static/js/backgrounds.js"></script>
  <script src="/static/js/wardrobe.js"></script>
  <script src="/static/js/pet_render.js"></script>
  <script src="/static/js/avatar.js"></script>
  <script src="/static/js/themes.js"></script>
  <script src="/static/js/scenery.js"></script>
  <script src="/static/js/alive.js"></script>
  <script src="/static/js/header.js"></script>
  <script>
    const STATS = [
      ["coins", "Coins now"],
      ["coins_earned_total", "Coins earned"],
      ["sessions_completed", "Sessions done"],
      ["keys_mastered", "Keys mastered"],
      ["items_owned", "Things owned"],
    ];
    document.getElementById("switch-player").addEventListener("click", async () => {
      await fetch("/api/profiles/logout", { method: "POST" });
      window.location.href = "/welcome";
    });
    fetch("/api/profile")
      .then((r) => r.json())
      .then((p) => {
        document.getElementById("profile-name").textContent = p.learner.name;
        const values = { coins: p.coins, ...p.stats };
        document.getElementById("stats").innerHTML = STATS.map(
          ([key, label]) => `<div class="stat"><strong>${values[key].toLocaleString()}</strong>${label}</div>`
        ).join("");
        const canvas = document.getElementById("profile-avatar");
        let frame = 0;
        drawAvatar(canvas, p.avatar);
        setInterval(() => drawAvatar(canvas, p.avatar, { frame: ++frame }), 600);
      });
  </script>
</body>
</html>
