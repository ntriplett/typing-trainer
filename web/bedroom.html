<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typing Trainer — My Home</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script src="/static/js/ui_scale.js"></script>
  <link rel="stylesheet" href="/static/css/teach.css" />
  <link rel="stylesheet" href="/static/css/scene.css" />
  <link rel="stylesheet" href="/static/css/bedroom.css" />
</head>
<body data-particles>
  <main class="wide">
    <header class="page-head">
      <h1>My Home</h1>
      <nav class="signposts" aria-label="Go back"><a class="signpost" href="/">🏠 Home</a></nav>
    </header>
    <p id="room-message" class="error-text" role="status"></p>
    <section class="panel house-floor">
      <div class="floor-head">
        <h2 id="room-title" class="panel-title"></h2>
        <nav id="room-nav" class="signposts" aria-label="Rooms"></nav>
      </div>
      <div class="shop-scene">
        <canvas id="room-canvas" width="960" height="540" tabindex="0"
          aria-label="Your home. In the bedroom, drag furniture to move it."></canvas>
        <div id="house-spots" class="scene-spots"></div>
      </div>
      <p id="room-hint" class="hint"></p>
    </section>
    <div id="decorate" class="decorate-row">
      <section class="panel">
        <h2 class="panel-title">Selected</h2>
        <p id="selected-name">Nothing yet. Click a piece of furniture!</p>
        <button id="put-away" hidden>Put away</button>
      </section>
      <section class="panel">
        <h2 class="panel-title">Not in the room</h2>
        <div id="inventory" class="thumb-grid"></div>
        <p class="hint">Buy more in the <a href="/store">store</a> (Bedroom tab).</p>
      </section>
      <section class="panel">
        <h2 class="panel-title">Wallpaper</h2>
        <div id="wallpapers" class="thumb-grid"></div>
        <h2 class="panel-title">Floor</h2>
        <div id="floorings" class="thumb-grid"></div>
      </section>
    </div>
  </main>
  <script src="/static/js/sprites.js"></script>
  <script src="/static/js/backgrounds.js"></script>
  <script src="/static/js/wardrobe.js"></script>
  <script src="/static/js/pet_render.js"></script>
  <script src="/static/js/avatar.js"></script>
  <script src="/static/js/room.js"></script>
  <script src="/static/js/house_scenes.js"></script>
  <script src="/static/js/pet_motion.js"></script>
  <script src="/static/js/house_dressing.js"></script>
  <script src="/static/js/house_nook.js"></script>
  <script src="/static/js/themes.js"></script>
  <script src="/static/js/scenery.js"></script>
  <script src="/static/js/rich_text.js"></script>
  <script src="/static/js/home_icons.js"></script>
  <script src="/static/js/alive.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/bedroom.js"></script>
</body>
</html>
