<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typing Trainer — Bedroom</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/static/css/teach.css" />
  <link rel="stylesheet" href="/static/css/bedroom.css" />
</head>
<body data-particles data-unlock="bedroom">
  <main class="wide">
    <h1>My Bedroom</h1>
    <p class="hint">Drag things to move them. Click something, then use the arrow keys to nudge it.</p>
    <div class="bedroom-layout">
      <section class="panel room-panel">
        <canvas id="room-canvas" class="avatar-canvas" width="576" height="576" tabindex="0"
          aria-label="Your bedroom. Drag furniture to move it."></canvas>
      </section>
      <aside class="room-side">
        <section class="panel">
          <h2 class="panel-title">Selected</h2>
          <p id="selected-name">Nothing yet. Click a piece of furniture!</p>
          <button id="put-away" hidden>Put away</button>
        </section>
        <section class="panel">
          <h2 class="panel-title">Not in the room</h2>
          <div id="inventory" class="thumb-grid"></div>
          <p class="hint">Buy more in the <a href="/store">store</a> (Bedroom tab).</p>
        </section>
        <section class="panel">
          <h2 class="panel-title">Wallpaper</h2>
          <div id="wallpapers" class="thumb-grid"></div>
          <h2 class="panel-title">Floor</h2>
          <div id="floorings" class="thumb-grid"></div>
        </section>
        <p id="room-message" class="error-text" role="status"></p>
      </aside>
    </div>
  </main>
  <script src="/static/js/sprites.js"></script>
  <script src="/static/js/backgrounds.js"></script>
  <script src="/static/js/wardrobe.js"></script>
  <script src="/static/js/pets.js"></script>
  <script src="/static/js/avatar.js"></script>
  <script src="/static/js/room.js"></script>
  <script src="/static/js/themes.js"></script>
  <script src="/static/js/rich_text.js"></script>
  <script src="/static/js/home_icons.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/bedroom.js"></script>
</body>
</html>
