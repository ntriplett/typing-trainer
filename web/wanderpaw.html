<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typing Trainer — Wanderpaw</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/static/css/wanderpaw.css" />
</head>
<body>
  <main class="wander">
    <section class="panel wander-hero">
      <div class="wander-hero-where">
        <h1>Wanderpaw</h1>
        <p class="wander-where"><span id="where-chip" class="type-chip"></span> <b id="where-name"></b> <span id="where-land"></span></p>
      </div>
      <p id="wander-message" class="wander-message" role="status"></p>
      <div class="wander-energy">
        <span id="energy" class="wander-energy" hidden>
          <span id="energy-label"></span>
          <span class="energy-bar" title="Gold: your own walking energy. Green: your pets' energy."><span class="energy-fill energy-pets" id="energy-pets"></span><span class="energy-fill" id="energy-fill"></span></span>
          <span id="energy-text"></span>
        </span>
        <button type="button" class="button-go" id="go-home">Go home</button>
      </div>
    </section>
    <p class="panel wander-pip" id="pip-hint" hidden></p>
    <div class="wander-play">
      <section class="panel wander-board">
        <canvas id="wander-local" class="wander-map" aria-label="Where you are"></canvas>
        <div class="wander-keys" id="keys"></div>
        <div class="wander-screen panel" id="screen" hidden>
          <h2 class="panel-title" id="screen-title"></h2>
          <canvas id="screen-scene" class="wander-scene" width="960" height="540" hidden></canvas>
          <canvas id="screen-portrait" class="wander-portrait" width="120" height="96" hidden></canvas>
          <p id="screen-text"></p>
          <div class="wander-letter" id="screen-letter" hidden>
            <p id="letter-to"></p>
            <div id="letter-read"></div>
            <div id="letter-prompt"></div>
            <p id="letter-signed"></p>
          </div>
          <p class="wander-line" id="screen-line" hidden></p>
          <p class="wander-screen-keys" id="screen-keys"></p>
        </div>
        <div class="wander-screen panel wander-picker" id="picker" hidden>
          <canvas id="picker-scene" class="wander-scene" width="960" height="540"></canvas>
          <h2 class="panel-title">Who's coming?</h2>
          <ul class="wander-pets" id="picker-pets"></ul>
          <p class="wander-screen-keys" id="picker-keys"></p>
        </div>
        <div class="wander-screen panel wander-menu" id="menu" hidden>
          <button type="button" id="menu-close" class="wander-menu-close" aria-label="Close">&times;</button>
          <h2 class="panel-title" id="menu-title"></h2>
          <div id="menu-body"></div>
          <p class="wander-screen-keys" id="menu-keys"></p>
        </div>
      </section>
      <div class="panel wander-battle wander-party wander-levelup" id="levelup" hidden>
        <div class="wander-levelup-confetti" id="levelup-confetti" aria-hidden="true"></div>
        <div id="levelup-detail"></div>
        <div id="levelup-choice"></div>
        <p class="wander-screen-keys" id="levelup-keys"></p>
      </div>
      <div class="panel wander-battle wander-party" id="party" hidden>
        <h2 class="panel-title">Party</h2>
        <div class="wander-party-split">
          <ul class="wander-menu-list" id="party-list"></ul>
          <div id="party-detail"></div>
        </div>
        <p class="wander-screen-keys" id="party-keys"></p>
      </div>
      <div class="panel wander-battle" id="battle" hidden>
        <div class="wander-battle-tools">
          <button type="button" id="battle-bag" title="Your bag"><kbd class="keycap">1</kbd> <span data-idea="Bag"></span> Bag</button>
          <button type="button" id="battle-guide" class="teal" title="The guidebook"><kbd class="keycap">2</kbd> <span data-idea="Book"></span> Guide</button>
        </div>
        <div class="wander-battle-sides">
          <div class="wander-battle-team" id="battle-team"></div>
          <div class="wander-battle-foe">
            <div class="wander-foe-art">
              <canvas id="battle-foe" width="220" height="170"></canvas>
              <canvas id="battle-marks" width="220" height="170"></canvas>
              <div id="battle-intent" class="wander-intent" hidden></div>
            </div>
            <div id="battle-foe-info"></div>
            <div id="battle-bench" class="wander-bench"></div>
          </div>
        </div>
        <ul class="wander-battle-log" id="battle-log"></ul>
        <p class="wander-screen-keys" id="battle-keys"></p>
      </div>
      <div class="panel wander-atlas" id="atlas" hidden>
        <div class="wander-atlas-head">
          <h2 class="panel-title">Map</h2>
          <p class="wander-screen-keys">Click a place to read about it. &nbsp; <kbd class="keycap">Esc</kbd> close</p>
        </div>
        <div class="wander-atlas-scroll"><canvas id="world-map" class="wander-map"></canvas></div>
        <div class="wander-atlas-info" id="atlas-info"></div>
      </div>
      <aside class="wander-side">
        <section class="panel">
          <h2 class="panel-title">Map</h2>
          <canvas id="wander-map" class="wander-map" aria-label="The big map"></canvas>
          <p class="wander-campfires" id="campfires"></p>
        </section>
        <section class="panel wander-books">
          <button type="button" data-menu="bag"><kbd class="keycap">1</kbd> Bag</button>
          <button type="button" data-menu="journal"><kbd class="keycap">2</kbd> Journal</button>
          <button type="button" data-menu="party"><kbd class="keycap">3</kbd> Party</button>
          <button type="button" data-menu="log"><kbd class="keycap">4</kbd> Log</button>
          <button type="button" data-menu="map"><kbd class="keycap">5</kbd> Map</button>
          <button type="button" data-menu="guide"><kbd class="keycap">6</kbd> Guide</button>
        </section>
      </aside>
    </div>
  </main>
  <script src="/static/js/sprites.js"></script>
  <script src="/static/js/backgrounds.js"></script>
  <script src="/static/js/wardrobe.js"></script>
  <script src="/static/js/pet_render.js"></script>
  <script src="/static/js/avatar.js"></script>
  <script src="/static/js/themes.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/rich_text.js"></script>
  <script src="/static/js/practice_scenes.js"></script>
  <script src="/static/js/game_kit.js"></script>
  <script src="/static/js/habitats.js"></script>
  <script src="/static/js/pet_motion.js"></script>
  <script src="/static/js/wander_scene.js"></script>
  <script src="/static/js/wander_map.js"></script>
  <script src="/static/js/wander_text.js"></script>
  <script src="/static/js/wander_moves.js"></script>
  <script src="/static/js/wander_items.js"></script>
  <script src="/static/js/prompt_view.js"></script>
  <script src="/static/js/wanderpaw.js"></script>
</body>
</html>
