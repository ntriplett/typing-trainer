<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typing Trainer — Wanderpaw</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/static/css/wanderpaw.css" />
</head>
<body>
  <main class="wander">
    <section class="panel wander-hero">
      <div>
        <h1>Wanderpaw</h1>
        <p class="wander-where"><span id="where-chip" class="type-chip"></span> <b id="where-name"></b> <span id="where-land"></span></p>
      </div>
      <div class="wander-energy" id="energy" hidden>
        <span>Energy</span>
        <div class="energy-bar"><div class="energy-fill" id="energy-fill"></div></div>
        <span id="energy-text"></span>
      </div>
    </section>
    <p id="wander-message" class="wander-message" role="status"></p>
    <div class="wander-play">
      <section class="panel wander-board">
        <canvas id="wander-local" class="wander-map" aria-label="Where you are"></canvas>
      </section>
      <aside class="wander-side">
        <section class="panel">
          <h2 class="panel-title">Map</h2>
          <canvas id="wander-map" class="wander-map" aria-label="The big map"></canvas>
          <p class="wander-campfires" id="campfires"></p>
        </section>
        <section class="panel wander-help" id="help"></section>
      </aside>
    </div>
  </main>
  <script src="/static/js/sprites.js"></script>
  <script src="/static/js/backgrounds.js"></script>
  <script src="/static/js/wardrobe.js"></script>
  <script src="/static/js/pet_render.js"></script>
  <script src="/static/js/avatar.js"></script>
  <script src="/static/js/themes.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/rich_text.js"></script>
  <script src="/static/js/practice_scenes.js"></script>
  <script src="/static/js/game_kit.js"></script>
  <script src="/static/js/wander_map.js"></script>
  <script src="/static/js/wanderpaw.js"></script>
</body>
</html>
