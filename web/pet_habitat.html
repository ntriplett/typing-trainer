<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typing Trainer — Habitat</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/static/css/pet_trail.css" />
</head>
<body data-particles>
  <main class="pet-trail">
    <header class="page-head">
      <h1 id="habitat-name">Habitat</h1>
      <nav class="signposts" aria-label="Go back"><a class="signpost" id="habitat-back" href="/pets/trail">🌲 Trailhead</a><a class="signpost" href="/pets">🐾 Pets</a><a class="signpost" href="/">🏠 Home</a></nav>
    </header>
    <section class="panel habitat-panel">
      <div class="habitat-scene">
        <canvas id="habitat-canvas" width="960" height="540"></canvas>
        <a id="habitat-gate" class="scene-sign" href="/pets/trail">⬅ To the trail</a>
        <div id="throw-words"></div>
      </div>
    </section>
    <p id="habitat-message" class="trail-message" role="status"></p>
    <section class="panel play-shelf">
      <h2 class="panel-title">Treats &amp; Toys</h2>
      <p id="play-hint" class="hint"></p>
      <div id="shelf" class="shelf"></div>
    </section>
    <section class="panel habitat-residents">
      <h2 class="panel-title" id="habitat-count"></h2>
      <div id="habitat-pets" class="habitat-pets"></div>
    </section>
  </main>
  <script src="/static/js/sprites.js"></script>
  <script src="/static/js/backgrounds.js"></script>
  <script src="/static/js/wardrobe.js"></script>
  <script src="/static/js/pet_render.js"></script>
  <script src="/static/js/avatar.js"></script>
  <script src="/static/js/themes.js"></script>
  <script src="/static/js/scenery.js"></script>
  <script src="/static/js/alive.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/habitats.js"></script>
  <script src="/static/js/habitats_outdoors.js"></script>
  <script src="/static/js/habitats_cozy.js"></script>
  <script src="/static/js/habitats_magic.js"></script>
  <script src="/static/js/pet_motion.js"></script>
  <script src="/static/js/supply_art.js"></script>
  <script src="/static/js/pet_habitat.js"></script>
</body>
</html>
