<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typing Trainer — Habitat</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/static/css/pet_trail.css" />
</head>
<body data-particles>
  <main class="pet-trail">
    <p class="back-link"><a id="habitat-back" href="/pets/trail">← Trailhead</a></p>
    <h1 id="habitat-name">Habitat</h1>
    <section class="panel habitat-panel">
      <canvas id="habitat-canvas" width="960" height="540"></canvas>
    </section>
    <p id="habitat-message" class="trail-message" role="status"></p>
    <section class="panel habitat-residents">
      <h2 class="panel-title" id="habitat-count"></h2>
      <div id="habitat-pets" class="habitat-pets"></div>
    </section>
  </main>
  <script src="/static/js/sprites.js"></script>
  <script src="/static/js/backgrounds.js"></script>
  <script src="/static/js/wardrobe.js"></script>
  <script src="/static/js/pets.js"></script>
  <script src="/static/js/avatar.js"></script>
  <script src="/static/js/themes.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/pet_render.js"></script>
  <script src="/static/js/habitats.js"></script>
  <script src="/static/js/pet_motion.js"></script>
  <script src="/static/js/pet_habitat.js"></script>
</body>
</html>
